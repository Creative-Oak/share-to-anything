name: ShareToAnything
options:
  bundleIdPrefix: dk.creativeoak
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 493257NQK3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: dk.creativeoak.share-to-anything
    APP_GROUP_ID: group.dk.creativeoak.share-to-anything
    # macOS authorizes team-prefixed groups by signature alone; "group." IDs need an explicit
    # provisioning profile, which Xcode doesn't always generate for extensions.
    "APP_GROUP_ID[sdk=macosx*]": $(DEVELOPMENT_TEAM).dk.creativeoak.share-to-anything
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SendKit:
    path: Packages/SendKit

# Keys read at runtime by SendKit.AppConfig.
x-shared-info: &sharedInfo
  AppGroupID: $(APP_GROUP_ID)
  KeychainAccessGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
  CFBundleDisplayName: Share to Anything
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)

x-url-types: &urlTypes
  CFBundleURLTypes:
    - CFBundleURLName: $(APP_BUNDLE_ID)
      CFBundleURLSchemes: [sharetoanything]

x-share-extension: &shareExtension
  NSExtensionPointIdentifier: com.apple.share-services
  NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
  NSExtensionAttributes:
    # Files, plus data-only items such as Mail attachments and Photos images (which arrive
    # without a file URL). Plain text and links are left out: there's nothing to send.
    NSExtensionActivationRule: >-
      SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
        SUBQUERY($attachment.registeredTypeIdentifiers, $type,
          $type UTI-CONFORMS-TO "public.file-url"
          OR ($type UTI-CONFORMS-TO "public.data"
            AND NOT $type UTI-CONFORMS-TO "public.text"
            AND NOT $type UTI-CONFORMS-TO "public.url")
        ).@count >= 1
      ).@count BETWEEN {1, 20}).@count >= 1

targets:
  # MARK: macOS

  ShareToAnything-macOS:
    type: application
    platform: macOS
    sources: [App/macOS]
    dependencies:
      - package: SendKit
        product: SendKit
      - package: SendKit
        product: SendKitUI
      - target: FinderExtension
      - target: Share-macOS
    settings:
      base:
        PRODUCT_NAME: Share to Anything
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/macOS/Info.plist
      properties:
        <<: [*sharedInfo, *urlTypes]
        LSUIElement: true
        # Lists the app under "Open in ▸" for Mail attachments and Finder's "Open With"
        # (Mail's attachment share menu only offers Apple's own services), without ever
        # becoming the default app for a file type. Claiming public.data instead counts as a
        # wildcard, and wildcard apps are left out of those menus.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.content
              - public.composite-content
              - com.adobe.pdf
              - public.image
              - public.audiovisual-content
              - public.text
              - public.archive
              - com.apple.mail.email
              - org.openxmlformats.openxml
              - org.oasis-open.opendocument
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/macOS/ShareToAnything.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)

  FinderExtension:
    type: app-extension
    platform: macOS
    sources: [Extensions/FinderExtension]
    dependencies:
      - package: SendKit
        product: SendKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).FinderSync
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Extensions/FinderExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Share to Anything Finder Menu
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderMenu
          NSExtensionAttributes: {}
    entitlements:
      path: Extensions/FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  Share-macOS:
    type: app-extension
    platform: macOS
    sources: [Extensions/ShareMac]
    dependencies:
      - package: SendKit
        product: SendKit
      - package: SendKit
        product: SendKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Share
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Extensions/ShareMac/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension: *shareExtension
    entitlements:
      path: Extensions/ShareMac/Share.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.security.files.user-selected.read-only: true

  # MARK: iOS

  ShareToAnything-iOS:
    type: application
    platform: iOS
    sources: [App/iOS]
    dependencies:
      - package: SendKit
        product: SendKit
      - package: SendKit
        product: SendKitUI
      - target: Share-iOS
    settings:
      base:
        PRODUCT_NAME: Share to Anything
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac has its own native app; don't offer the iPad build there.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: App/iOS/Info.plist
      properties:
        <<: [*sharedInfo, *urlTypes]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/iOS/ShareToAnything.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)

  Share-iOS:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShareiOS]
    dependencies:
      - package: SendKit
        product: SendKit
      - package: SendKit
        product: SendKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Share
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Extensions/ShareiOS/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension: *shareExtension
    entitlements:
      path: Extensions/ShareiOS/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]

# Only the two apps get schemes; extensions are built and embedded through them.
schemes:
  ShareToAnything-macOS:
    build:
      targets:
        ShareToAnything-macOS: all
    run:
      config: Debug
  ShareToAnything-iOS:
    build:
      targets:
        ShareToAnything-iOS: all
    run:
      config: Debug
